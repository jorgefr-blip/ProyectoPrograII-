<div class="container mt-5">
  <h1 class="mb-4">Anuncios</h1>
  <div *ngFor="let noticia of noticias" class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">{{ noticia.titulo }}</h5>
      <p class="card-text">{{ noticia.descripcion }}</p>
      
      <!-- Mostrar imagen solo una vez -->
      <img [src]="noticia.imagen" alt="Imagen de {{ noticia.titulo }}" class="img-fluid rounded" style="max-width: 100px; height: auto;">
      
      <!-- Formateamos la fecha con el pipe "date" -->
      <p class="card-text">
        <small class="text-muted">{{ noticia.fecha | date: 'fullDate' }}</small>
      </p>

      <div class="d-flex justify-content-between">
        <button class="btn btn-danger" (click)="eliminarNoticia(noticia.idnoticia)">Eliminar</button>
        <button class="btn btn-warning" (click)="modificarNoticia(noticia)">Modificar</button>
      </div>
    </div>
  </div>
</div>
