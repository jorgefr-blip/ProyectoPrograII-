<div class="container mt-5">
    <h1 class="mb-4">Edición de Platillos</h1>
    <hr>
    <form (ngSubmit)="editarPlatillo()" id="platilloForm" class="needs-validation" novalidate>
      
      <div class="form-group mb-3">
        <label for="foto" class="form-label">Foto </label>
        <input type="text" id="foto" class="form-control" [(ngModel)]="platillo.foto"
          [ngModelOptions]="{standalone: true}" required>
        <div class="invalid-feedback">La URL de la foto es obligatoria.</div>
      </div>
      <hr>
  
      <div class="form-group mb-3">
        <label for="precio" class="form-label">Precio:</label>
        <input type="number" id="precio" class="form-control" [(ngModel)]="platillo.precio"
          [ngModelOptions]="{standalone: true}" required>
        <div class="invalid-feedback">El precio es obligatorio.</div>
      </div>
      <hr>
  
      <div class="form-group mb-3">
        <label for="descripcion" class="form-label">Descripción:</label>
        <input type="text" id="descripcion" class="form-control" [(ngModel)]="platillo.descripcion"
          [ngModelOptions]="{standalone: true}" required>
        <div class="invalid-feedback">La descripción es obligatoria.</div>
      </div>
      <hr>
  
      <button type="submit" class="btn btn-success">Guardar cambios</button>
    </form>
  </div>
